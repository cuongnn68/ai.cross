name: Windows release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test ./...
      - name: Build Windows executables
        env:
          CGO_ENABLED: '0'
          GOOS: windows
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          foreach ($arch in @('amd64', 'arm64')) {
            $env:GOARCH = $arch
            $file = "dist/ai-cross-windows-$arch.exe"
            go build -trimpath -ldflags "-s -w -X main.version=main-$env:GITHUB_SHA" -o $file .
            if ($LASTEXITCODE -ne 0) { throw "Build failed for $arch" }
            (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() |
              Set-Content "$file.sha256" -Encoding ascii
          }
      - name: Check CLI
        run: |
          $version = & ./dist/ai-cross-windows-amd64.exe version
          if ($LASTEXITCODE -ne 0 -or $version -ne "main-$env:GITHUB_SHA") {
            throw 'Unexpected CLI version'
          }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "main-$env:GITHUB_SHA"
          $files = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @files --target $env:GITHUB_SHA --latest `
              --title "Main build $($env:GITHUB_SHA.Substring(0, 7))" `
              --notes "Windows binaries built from main at $env:GITHUB_SHA." `
              --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
